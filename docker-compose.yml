version: '3.8'

services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: neurotrack-ml
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: neurotrack-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/neurotrackai
      - JWT_SECRET=neurotrack_super_secret_jwt_key_2026
      - CLIENT_URL=http://localhost:5173
      - ML_SERVICE_URL=http://ml-service:8000/api/v1
    depends_on:
      - mongo
      - ml-service
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: neurotrack-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
