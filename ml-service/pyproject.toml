[project]
name = "neurotrack-ml"
version = "1.0.0"
description = "FastAPI ML Sidecar for NeuroTrack - Parkinson's & Paralysis/Stroke Screening"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.2",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
